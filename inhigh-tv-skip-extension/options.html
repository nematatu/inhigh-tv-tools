<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>インハイTV スキップ設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <div class="title-row">
        <div class="logo" aria-hidden="true">↶</div>
        <div>
          <h1>インハイTV スキップ</h1>
          <p class="subtitle">動画の戻る・進む秒数を設定します</p>
        </div>
      </div>

      <form id="settings-form">
        <label class="field" for="skip-seconds">
          <span>スキップ秒数</span>
          <span class="number-control">
            <input
              id="skip-seconds"
              name="skipSeconds"
              type="number"
              min="1"
              max="300"
              step="1"
              inputmode="numeric"
              required
            />
            <span>秒</span>
          </span>
        </label>

        <div class="presets" aria-label="スキップ秒数の候補">
          <button type="button" class="preset" data-seconds="5">5秒</button>
          <button type="button" class="preset" data-seconds="10">10秒</button>
          <button type="button" class="preset" data-seconds="15">15秒</button>
          <button type="button" class="preset" data-seconds="30">30秒</button>
        </div>

        <label class="check-row" for="keyboard-enabled">
          <input id="keyboard-enabled" name="keyboardEnabled" type="checkbox" />
          <span>
            <strong>キーボード操作を使う</strong>
            <small>← で戻る、→ で進む、Spaceで再生／一時停止</small>
          </span>
        </label>

        <div class="actions">
          <button type="button" id="reset-button" class="secondary">初期値に戻す</button>
          <button type="submit" class="primary">保存</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <p class="hint">
        設定は開いているインハイTVにも自動反映されます。入力欄や設定メニューの操作中はキーボードショートカットを横取りしません。
      </p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
