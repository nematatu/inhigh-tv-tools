<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>インハイTV スキップ拡張テスト</title>
    <link rel="stylesheet" href="../content.css" />
    <style>
      body {
        margin: 24px;
        background: #20242c;
        color: #fff;
        font-family: sans-serif;
      }

      .video-js {
        position: relative;
        width: 730px;
        height: 411px;
        background: #111;
      }

      .vjs-tech {
        display: block;
        width: 100%;
        height: 100%;
      }

      .vjs-chrome-bottom {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 41px;
        background: rgb(0 0 0 / 80%);
      }

      .vjs-left-controls {
        display: flex;
        align-items: center;
        height: 36px;
        padding-left: 10px;
      }

      .vjs-play-control,
      .vjs-mute-button {
        width: 36px;
        height: 36px;
        border: 0;
        color: #fff;
        background: transparent;
      }

      #test-result {
        margin-top: 18px;
        padding: 12px;
        background: #111;
        font-family: monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="streaks_player_main" class="video-js streaks-player strp-contentplayback">
      <video class="vjs-tech"></video>
      <div class="vjs-chrome-bottom">
        <div class="vjs-chrome-controls">
          <div class="vjs-left-controls">
            <button class="vjs-play-control vjs-control vjs-button" type="button">再生</button>
            <span><button class="vjs-mute-button" type="button">音量</button></span>
            <div class="vjs-time-display">1:40 / 10:00</div>
          </div>
        </div>
      </div>
    </div>
    <button id="set-five-seconds" type="button">テスト設定を5秒に変更</button>
    <label>入力テスト <input id="typing-test" type="text" /></label>
    <div id="test-result">テスト準備中</div>

    <script src="player-harness.js"></script>
    <script src="../content.js"></script>
  </body>
</html>
